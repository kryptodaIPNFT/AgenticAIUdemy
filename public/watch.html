<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lesson — Westmont Video Portal</title>
  <link rel="icon" href="/logo/westmontlogo.webp" type="image/webp" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('vp-theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="page-watch">
  <div class="bg" aria-hidden="true">
    <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i>
  </div>

  <header class="topbar">
    <a class="brand" href="/dashboard">
      <img src="/logo/westmontlogo.webp" alt="Westmont logo" />
      <span>Dashboard</span>
    </a>
    <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle light / dark mode">
      <span class="icon-moon" aria-hidden="true">&#9789;</span>
      <span class="icon-sun" aria-hidden="true">&#9728;</span>
    </button>
  </header>

  <main class="watch-wrap">
    <div class="player-shell reveal">
      <video id="player" controls playsinline preload="metadata">
        Your browser does not support the video tag.
      </video>
      <div class="speed-row">
        <span class="speed-label">Playback speed</span>
        <button class="speed-btn" type="button" data-rate="0.5">0.5x</button>
        <button class="speed-btn is-active" type="button" data-rate="1">1x</button>
        <button class="speed-btn" type="button" data-rate="1.25">1.25x</button>
        <button class="speed-btn" type="button" data-rate="1.5">1.5x</button>
        <button class="speed-btn" type="button" data-rate="2">2x</button>
      </div>
    </div>

    <h1 class="watch-title reveal" id="watchTitle">Lesson</h1>

    <section class="watch-card reveal">
      <h2>About this lesson</h2>
      <p id="watchDesc" class="watch-desc">No description yet — your admin can add one from the admin panel.</p>
      <div id="resourceRow" class="resource-row" hidden>
        <a id="resourceBtn" class="btn btn-primary" href="#" target="_blank" rel="noopener">
          <span aria-hidden="true">&#11015;</span> Open lesson resource
        </a>
      </div>
    </section>

    <section class="watch-card reveal" id="snippetCard" hidden>
      <h2>Code for this lesson</h2>
      <div id="snippetList"></div>
    </section>

    <div class="watch-actions reveal">
      <button id="btnMarkDone" class="btn btn-primary" type="button">Mark lesson as complete</button>
      <a class="btn btn-ghost" href="/dashboard">&larr; Back to lessons</a>
    </div>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/watch.js"></script>
</body>
</html>
