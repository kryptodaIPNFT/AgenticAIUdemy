<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify sign-in — Westmont Video Portal</title>
  <link rel="icon" href="/logo/westmontlogo.webp" type="image/webp" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('vp-theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="page-reader">
  <div class="bg" aria-hidden="true">
    <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i>
  </div>

  <header class="topbar">
    <a class="brand" href="/">
      <img src="/logo/westmontlogo.webp" alt="Westmont logo" />
      <span>Sign-in</span>
    </a>
    <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle light / dark mode">
      <span class="icon-moon" aria-hidden="true">&#9789;</span>
      <span class="icon-sun" aria-hidden="true">&#9728;</span>
    </button>
  </header>

  <main class="reader-wrap">
    <section class="reader-card reveal" aria-live="polite">
      <div class="reader-state" id="rPending">
        <h1>Verify &amp; sign in</h1>
        <p class="reader-sub">This phone is about to authorize the desktop screen.</p>

        <div class="reader-code-box">
          <span class="reader-code-label">Sign-in code</span>
          <b class="reader-code" id="rCode"></b>
        </div>

        <label class="field-label" for="rStudent">Your student profile</label>
        <select id="rStudent" class="field" required>
          <option value="" disabled selected>Loading profiles&hellip;</option>
        </select>

        <button id="rVerify" class="btn btn-primary btn-block" type="button">Verify &amp; sign in</button>
        <p id="rError" class="form-error" hidden></p>
      </div>

      <div class="reader-state" id="rDone" hidden>
        <div class="ok-badge" aria-hidden="true">&#10003;</div>
        <h1>You're signed in!</h1>
        <p id="rDoneText">The desktop screen is opening the dashboard now. You can close this page.</p>
      </div>
    </section>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/reader.js"></script>
</body>
</html>
