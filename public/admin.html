<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Westmont Video Portal</title>
  <link rel="icon" href="/logo/westmontlogo.webp" type="image/webp" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('vp-theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body class="page-admin">
  <div class="bg" aria-hidden="true">
    <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i>
  </div>

  <header class="topbar">
    <a class="brand" href="/">
      <img src="/logo/westmontlogo.webp" alt="Westmont logo" />
      <span>Admin</span>
    </a>
    <div class="topbar-right">
      <button id="btnLogout" class="btn btn-ghost btn-sm" type="button" hidden>Sign out</button>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle light / dark mode">
        <span class="icon-moon" aria-hidden="true">&#9789;</span>
        <span class="icon-sun" aria-hidden="true">&#9728;</span>
      </button>
    </div>
  </header>

  <main class="admin-wrap">
    <!-- login gate -->
    <section class="admin-login reveal" id="adminGate" aria-live="polite">
      <h1>Admin area</h1>
      <p class="reader-sub">Secure section — enter the admin password to manage lesson content.</p>
      <form id="adminLoginForm" class="admin-form">
        <label class="field-label" for="adminPass">Admin password</label>
        <input id="adminPass" class="field" type="password" autocomplete="current-password" required />
        <button class="btn btn-primary btn-block" type="submit">Unlock</button>
        <p id="adminLoginError" class="form-error" hidden></p>
      </form>
    </section>

    <!-- editor -->
    <section id="adminEditor" hidden>
      <div class="admin-head">
        <h1>Lesson content</h1>
        <p class="reader-sub">Descriptions, resource links and code snippets appear on the student watch page. Changes save per lesson.</p>
      </div>
      <div id="adminList" class="admin-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
